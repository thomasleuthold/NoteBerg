<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="A note-taking app supporting handwritten notes, text, and drawings"
    />
    <meta name="theme-color" content="#3b82f6" />

    <title>oneJournal</title>

    <!-- PWA manifest (to be added later) -->
    <!-- <link rel="manifest" href="/manifest.json"> -->

    <!-- Favicon (to be added later) -->
    <!-- <link rel="icon" type="image/svg+xml" href="/favicon.svg"> -->
  </head>
  <body>
    <div id="app">
      <!-- Top Toolbar -->
      <header id="toolbar" class="toolbar">
        <div class="toolbar-left">
          <nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb navigation">
            <button id="nav-overview" class="breadcrumb-item" aria-label="Home" title="Home">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </button>
          </nav>
        </div>
        <div class="toolbar-center">
        </div>
        <div class="toolbar-right">
          <button id="nav-settings" class="btn-icon" aria-label="Settings" title="Settings">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </header>

      <div class="app-container">
        <!-- Main content area -->
        <main id="main-content" class="main-content">
          <!-- Content will be rendered by router -->
        </main>
      </div>

      <!-- Footer -->
      <footer id="footer" class="footer">
        <div class="footer-left">
          <span class="sync-status" data-status="offline">
            <span class="sync-indicator">○</span>
            <span class="sync-text">Offline</span>
          </span>
        </div>
        <div class="footer-right">
          <span class="app-version">v0.1.0</span>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
