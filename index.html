<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="A note-taking app supporting handwritten notes, text, and drawings"
    />
    <meta name="theme-color" content="#3b82f6" />

    <title>oneJournal</title>

    <!-- PWA manifest (to be added later) -->
    <!-- <link rel="manifest" href="/manifest.json"> -->

    <!-- Favicon (to be added later) -->
    <!-- <link rel="icon" type="image/svg+xml" href="/favicon.svg"> -->
  </head>
  <body>
    <div id="app">
      <!-- Top Toolbar -->
      <header id="toolbar" class="toolbar">
        <div class="toolbar-left">
          <button id="menu-btn" class="btn-icon" aria-label="Menu" title="Toggle sidebar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
          </button>
          <nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb navigation">
            <button id="nav-overview" class="breadcrumb-item" aria-label="Home" title="Home">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </button>
          </nav>
        </div>
        <div class="toolbar-center">
        </div>
      </header>

      <div class="app-container">
        <!-- Sidebar for notes list -->
        <aside id="sidebar" class="sidebar">
          <div class="sidebar-header" id="sidebar-header">
            <!-- Dynamic header content -->
          </div>
          <div id="notes-list" class="notes-list">
            <div class="empty-state">
              <div class="empty-state-icon" style="color: var(--text-secondary); margin-bottom: 10px;">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
              </div>
              <div class="empty-state-text">No notes yet</div>
            </div>
          </div>
        </aside>

        <!-- Main content area -->
        <main id="main-content" class="main-content">
          <!-- Content will be rendered by router -->
        </main>
      </div>

      <!-- Footer -->
      <footer id="footer" class="footer">
        <div class="footer-left">
          <span class="sync-status" data-status="offline">
            <span class="sync-indicator">○</span>
            <span class="sync-text">Offline</span>
          </span>
        </div>
        <div class="footer-right">
          <span class="app-version">v0.1.0</span>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
