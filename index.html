<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no / maximum-scale=1: the note canvas implements its own
         pinch-zoom (NoteCanvas._onPointerMoveNav). WebView page zoom would fight
         it, and once the page is zoomed the 100dvh app box no longer matches the
         visual viewport — the header slides under the Android status bar and the
         footer off-screen. Only the Tauri/Android build reads this file; the
         Nextcloud build enters via src/main.js and owns its own viewport. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="A note-taking app supporting handwritten notes, text, and drawings"
    />
    <meta name="theme-color" content="#3b82f6" />

    <title>NoteBerg</title>

    <!-- PWA manifest (to be added later) -->
    <!-- <link rel="manifest" href="/manifest.json"> -->

    <!-- Favicon (to be added later) -->
    <!-- <link rel="icon" type="image/svg+xml" href="/favicon.svg"> -->
  </head>
  <body>
    <div id="app">
      <!-- Top Toolbar -->
      <header id="toolbar" class="toolbar">
        <div class="toolbar-left">
          <nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb navigation">
            <button id="nav-overview" class="breadcrumb-item" aria-label="Home" title="Home">
              <!-- Icon injected by breadcrumb.js -->
            </button>
          </nav>
        </div>
        <div class="toolbar-center">
        </div>
        <div class="toolbar-right">
          <button id="nav-settings" class="btn-icon" aria-label="Settings" title="Settings">
            <!-- Icon injected by main.js -->
          </button>
        </div>
      </header>

      <div class="app-container">
        <!-- Main content area -->
        <main id="main-content" class="main-content">
          <!-- Content will be rendered by router -->
        </main>
      </div>

      <!-- Footer -->
      <footer id="footer" class="footer">
        <div class="footer-left">
          <span class="sync-status" data-status="offline">
            <span class="sync-indicator">○</span>
            <span class="sync-progress"></span>
          </span>
        </div>
        <div class="footer-right">
          <span class="app-version">v0.1.0</span>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
