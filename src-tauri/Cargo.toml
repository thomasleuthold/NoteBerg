[package]
name = "onejournal"
version = "0.2.1"
description = "A note-taking app supporting handwritten notes, text, and drawings"
authors = ["you"]
edition = "2021"

[lib]
name = "onejournal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
