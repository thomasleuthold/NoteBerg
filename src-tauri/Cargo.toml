[package]
name = "onejournal"
version = "0.1.0"
description = "A note-taking app supporting handwritten notes, text, and drawings"
authors = ["you"]
edition = "2021"

[lib]
name = "onejournal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Security_Credentials_UI", "Foundation", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
