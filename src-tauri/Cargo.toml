[package]
name = "noteberg"
version = "0.5.38"
description = "A note-taking app supporting handwritten notes, text, and drawings"
authors = ["you"]
edition = "2021"

[lib]
name = "noteberg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["wry"] }
tauri-runtime = "=2.11.3"
tauri-runtime-wry = "=2.11.4"
# No explicit `wry` pin: resolved from tauri-runtime-wry's own manifest, which
# tracks the wry version tauri actually depends on. The previous exact pin
# (=0.53.5, matching tauri 2.9.4's wry) would otherwise force cargo to fail
# resolving once tauri needs a newer wry than that.
#
# The three tauri-* crates are pinned to DIFFERENT patch numbers deliberately —
# each publishes on its own cadence and does not track the umbrella `tauri`
# crate's version 1:1 (confirmed via `cargo search` against the live index at
# the time of this bump: tauri=2.11.5, tauri-runtime=2.11.3,
# tauri-runtime-wry=2.11.4). Pinning all three to the same number, as a prior
# version of this file did, only works by coincidence and will fail resolution
# the next time their release cadences diverge further.
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"

[target.'cfg(target_os = "windows")'.dependencies]
ureq = "2"
webview2-com = "0.38"
windows-core = "0.61"
windows = { version = "0.58", features = ["Win32_Media_Audio", "Win32_System_Com"] }
keyring = { version = "3", default-features = false, features = ["windows-native"] }
cpal = "0.15"
hound = "3"
tiny_http = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "ios")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }
